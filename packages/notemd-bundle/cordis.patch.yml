# Portable NoteMD workflow providers. Values remain deployment-owned; a later
# profile patch replaces a row's whole config and must restate its fields.
- insert:
    - id: notemd-vault
      name: 'dsh-notemd/vault-local'
      config:
        workspaceRoot: !!js process.cwd()

    - id: notemd-approval
      name: 'dsh-notemd/approval'
      config:
        workspaceRoot: !!js process.cwd()
        approvalTtlMs: 300000

    - id: notemd-workspace-changes
      name: 'dsh-notemd/workspace-changes'
      inject: [notemdVault]
      config:
        scanIntervalMs: 5000

    - id: notemd-knowledge
      name: 'dsh-notemd/knowledge'
      inject: [notemdVault, notemdWorkspaceChanges]

    - id: notemd-artifacts
      name: 'dsh-notemd/artifacts'
      inject: [notemdVault, subprocess]
      config:
        workspaceRoot: !!js process.cwd()

    - id: notemd-llm
      name: 'dsh-notemd/llm'
      inject: [llm]
      config:
        provider: deepseek
        model: deepseek-chat
        maxTokens: 4096
        promptPolicyId: notemd.default.v1

    - id: notemd-research
      name: 'dsh-notemd/research'
      inject: [web]
      config:
        workspaceRoot: !!js process.cwd()

    - id: notemd-workflows
      name: 'dsh-notemd/workflows'
      inject: [notemdVault, notemdTextTransformer]

    - id: notemdCompositeWorkflows
      name: 'dsh-notemd/composites'
      inject: [notemdVault, notemdWorkflows]

    - id: notemd-jobs
      name: 'dsh-notemd/jobs'
      inject: [notemdWorkflows, notemdResearch, notemdCompositeWorkflows]
      config:
        workspaceRoot: !!js process.cwd()
        concurrency: 2

    - id: notemd-tools
      name: 'dsh-notemd/tools'
      inject:
        [tools, notemdVault, notemdJobs, notemdWorkspaceChanges, notemdKnowledge, notemdTextTransformer, notemdWorkflows, notemdCompositeWorkflows, notemdResearch, notemdArtifacts, notemdApprovalLedger, notemdApprovalGate]
