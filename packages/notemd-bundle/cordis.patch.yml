# Portable NoteMD workflow providers. Values remain deployment-owned; a later
# profile patch replaces a row's whole config and must restate its fields.
- insert:
    - id: notemd-vault
      name: '@jacobinwwey/notemd-deepseek-harness/vault-local'
      config:
        workspaceRoot: !!js process.cwd()

    - id: notemd-approval
      name: '@jacobinwwey/notemd-deepseek-harness/approval'
      config:
        workspaceRoot: !!js process.cwd()
        approvalTtlMs: 300000

    - id: notemd-workspace-changes
      name: '@jacobinwwey/notemd-deepseek-harness/workspace-changes'
      inject: [notemdVault]
      config:
        scanIntervalMs: 5000

    - id: notemd-knowledge
      name: '@jacobinwwey/notemd-deepseek-harness/knowledge'
      inject: [notemdVault, notemdWorkspaceChanges]

    - id: notemd-artifacts
      name: '@jacobinwwey/notemd-deepseek-harness/artifacts'
      inject: [notemdVault, subprocess]
      config:
        workspaceRoot: !!js process.cwd()

    - id: notemd-llm
      name: '@jacobinwwey/notemd-deepseek-harness/llm'
      inject: [llm]
      config:
        provider: deepseek
        model: deepseek-chat
        maxTokens: 4096
        promptPolicyId: notemd.default.v1

    - id: notemd-research
      name: '@jacobinwwey/notemd-deepseek-harness/research'
      inject: [web]
      config:
        workspaceRoot: !!js process.cwd()

    - id: notemd-workflows
      name: '@jacobinwwey/notemd-deepseek-harness/workflows'
      inject: [notemdVault, notemdTextTransformer]

    - id: notemd-jobs
      name: '@jacobinwwey/notemd-deepseek-harness/jobs'
      inject: [notemdWorkflows, notemdResearch]
      config:
        workspaceRoot: !!js process.cwd()
        concurrency: 2

    - id: notemd-tools
      name: '@jacobinwwey/notemd-deepseek-harness/tools'
      inject:
        [tools, notemdVault, notemdJobs, notemdWorkspaceChanges, notemdKnowledge, notemdTextTransformer, notemdWorkflows, notemdResearch, notemdArtifacts, notemdApprovalLedger, notemdApprovalGate]
